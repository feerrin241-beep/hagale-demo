<?xml version="1.0" encoding="UTF-8"?>
<!--
  HÁGALE original hero illustration.
  Built from vector shapes only: no stock photography, fonts, external SVGs, or third-party assets.
  It may be displayed with: <img src="/assets/hagale-moto-hero.svg" alt="...">.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="title description">
  <title id="title">Motociclista HÁGALE en una moto amarilla</title>
  <desc id="description">Ilustración vectorial original de un motociclista con casco amarillo sobre una moto urbana amarilla y negra.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset=".55" stop-color="#121318"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="57%" r="56%">
      <stop offset="0" stop-color="#ffe46e" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ffd800" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffd800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yellowPaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff28a"/>
      <stop offset=".22" stop-color="#ffd800"/>
      <stop offset="1" stop-color="#e5a500"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset=".32" stop-color="#949aa5"/>
      <stop offset=".7" stop-color="#262a32"/>
      <stop offset="1" stop-color="#c9ced6"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#434954"/>
      <stop offset=".65" stop-color="#181b21"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Night road and a discreet route motif. -->
  <rect width="720" height="600" rx="52" fill="url(#background)"/>
  <ellipse cx="364" cy="395" rx="332" ry="245" fill="url(#glow)"/>
  <g opacity=".4">
    <path d="M-40 492 C110 420 189 529 310 473 S504 393 770 430" fill="none" stroke="#30323a" stroke-width="46"/>
    <path d="M-40 492 C110 420 189 529 310 473 S504 393 770 430" fill="none" stroke="#1a1c22" stroke-width="30"/>
    <path d="M-40 492 C110 420 189 529 310 473 S504 393 770 430" fill="none" stroke="#ffd800" stroke-width="3" stroke-dasharray="16 20"/>
  </g>
  <g opacity=".2" fill="#eef0f4">
    <rect x="61" y="201" width="6" height="157" rx="3"/>
    <rect x="87" y="163" width="10" height="195" rx="5"/>
    <rect x="116" y="226" width="8" height="132" rx="4"/>
    <rect x="591" y="175" width="8" height="180" rx="4"/>
    <rect x="615" y="212" width="12" height="143" rx="6"/>
    <rect x="651" y="141" width="7" height="215" rx="4"/>
  </g>
  <g opacity=".8" filter="url(#smallGlow)">
    <circle cx="140" cy="240" r="4" fill="#ffd800"/>
    <circle cx="594" cy="270" r="4" fill="#ffd800"/>
    <circle cx="658" cy="362" r="3" fill="#fff7ba"/>
  </g>

  <!-- Ground shadow. -->
  <ellipse cx="364" cy="512" rx="252" ry="27" fill="#000" opacity=".65" filter="url(#softBlur)"/>
  <ellipse cx="367" cy="516" rx="217" ry="9" fill="#ffd800" opacity=".6"/>

  <!-- Rear wheel. -->
  <g>
    <circle cx="235" cy="448" r="82" fill="#08090c" stroke="#2b2e36" stroke-width="10"/>
    <circle cx="235" cy="448" r="59" fill="none" stroke="#4e5561" stroke-width="5"/>
    <circle cx="235" cy="448" r="28" fill="#171a20" stroke="url(#metal)" stroke-width="7"/>
    <circle cx="235" cy="448" r="8" fill="#ffd800"/>
    <g stroke="#6e7580" stroke-width="3" opacity=".72">
      <path d="M235 389v118M176 448h118M193 406l84 84M277 406l-84 84"/>
    </g>
  </g>

  <!-- Front wheel. -->
  <g>
    <circle cx="496" cy="448" r="82" fill="#08090c" stroke="#2b2e36" stroke-width="10"/>
    <circle cx="496" cy="448" r="59" fill="none" stroke="#4e5561" stroke-width="5"/>
    <circle cx="496" cy="448" r="28" fill="#171a20" stroke="url(#metal)" stroke-width="7"/>
    <circle cx="496" cy="448" r="8" fill="#ffd800"/>
    <g stroke="#6e7580" stroke-width="3" opacity=".72">
      <path d="M496 389v118M437 448h118M454 406l84 84M538 406l-84 84"/>
    </g>
  </g>

  <!-- Motorcycle chassis. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M249 423 315 353 403 416 275 423Z" fill="#151820" stroke="#090a0d" stroke-width="9"/>
    <path d="M272 423 338 354 404 416" fill="none" stroke="url(#yellowPaint)" stroke-width="12"/>
    <path d="M398 408 452 320 495 422" fill="none" stroke="#c9ced6" stroke-width="10"/>
    <path d="M421 412 467 331" fill="none" stroke="#12141a" stroke-width="6"/>
    <path d="M424 337 476 328" fill="none" stroke="#c8ccd2" stroke-width="8"/>
    <path d="M458 328 480 310" fill="none" stroke="#c8ccd2" stroke-width="7"/>
    <path d="M487 309h35" fill="none" stroke="#101217" stroke-width="8"/>
    <path d="M302 409h-67" fill="none" stroke="#969da9" stroke-width="10"/>
    <path d="M205 413h-48" fill="none" stroke="#737a85" stroke-width="11"/>
    <path d="M275 410 257 367" fill="none" stroke="#151820" stroke-width="15"/>
    <path d="M266 374h77" fill="none" stroke="#151820" stroke-width="17"/>
    <path d="M256 369h86" fill="none" stroke="url(#yellowPaint)" stroke-width="9"/>
    <path d="M212 399 179 371" fill="none" stroke="#151820" stroke-width="12"/>
    <path d="M167 369h-28" fill="none" stroke="#ffd800" stroke-width="5"/>
  </g>

  <!-- Tank, seat, and lights. -->
  <g stroke-linejoin="round">
    <path d="M313 330c17-27 58-34 91-19l23 34-30 42-95-1-17-29z" fill="url(#yellowPaint)" stroke="#08090c" stroke-width="8"/>
    <path d="M325 338c18-15 43-20 63-12" fill="none" stroke="#fff5aa" stroke-width="5" opacity=".74"/>
    <path d="M256 343c10-17 34-24 59-18l31 24-17 18h-83z" fill="#101218" stroke="#07080a" stroke-width="7"/>
    <path d="M393 344h32l18 16-19 19h-32z" fill="#1f2229" stroke="#08090c" stroke-width="6"/>
    <path d="M438 337 464 347 456 366 433 359z" fill="#f7f8fa" stroke="#111318" stroke-width="5"/>
    <path d="M433 344 453 351" stroke="#fff28a" stroke-width="5" filter="url(#smallGlow)"/>
    <path d="M251 354h-29l-14 13 23 9 28-7z" fill="#e53d30" stroke="#08090c" stroke-width="5"/>
  </g>

  <!-- Rider legs and boots. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M311 315c-18 26-25 68-7 103l43 12 31-68-29-47z" fill="#28313f" stroke="#0d1016" stroke-width="9"/>
    <path d="M345 422 381 423 410 453 394 468 356 446 319 443z" fill="#101217" stroke="#050608" stroke-width="7"/>
    <path d="M293 414 260 430 222 457 239 474 279 451 322 442z" fill="#111318" stroke="#050608" stroke-width="7"/>
    <path d="M408 452 438 457 444 472 399 475z" fill="#08090c"/>
    <path d="M216 458 186 476 194 490 239 473z" fill="#08090c"/>
  </g>

  <!-- Jacket and arms. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 225c16-33 79-39 112-8 23 21 30 69 8 112l-22 37-97-2-26-37c-9-34 3-76 25-102z" fill="url(#jacket)" stroke="#08090d" stroke-width="10"/>
    <path d="M318 228 344 360" fill="none" stroke="#ffd800" stroke-width="17"/>
    <path d="M342 228 362 359" fill="none" stroke="#2b303a" stroke-width="8"/>
    <path d="M286 246c-22 12-46 40-60 74l21 14c18-20 34-38 58-53z" fill="#262c36" stroke="#090b0f" stroke-width="9"/>
    <path d="M246 324 271 340 302 320" fill="none" stroke="#ffd800" stroke-width="7"/>
    <path d="M397 247c30 11 55 40 66 69l-20 15c-19-20-35-37-60-51z" fill="#252b35" stroke="#090b0f" stroke-width="9"/>
    <path d="M440 320 465 337 484 316" fill="none" stroke="#ffd800" stroke-width="7"/>
    <circle cx="246" cy="332" r="12" fill="#151820" stroke="#ffd800" stroke-width="5"/>
    <circle cx="448" cy="330" r="12" fill="#151820" stroke="#ffd800" stroke-width="5"/>
  </g>

  <!-- Neck and original yellow full-face helmet. -->
  <path d="M319 222v31c10 15 35 17 47 1v-36z" fill="#b97a50" stroke="#0a0b0f" stroke-width="7"/>
  <g stroke-linejoin="round">
    <path d="M283 168c0-62 48-109 108-99 45 8 75 45 73 91-2 24-12 47-31 64l-1 28-65-6-18-27c-39-9-66-31-66-51z" fill="url(#yellowPaint)" stroke="#08090c" stroke-width="10"/>
    <path d="M304 175c24-42 82-58 126-23 13 11 22 26 26 43-55-11-100-6-149 12-4-11-5-21-3-32z" fill="#161a22" stroke="#050609" stroke-width="7"/>
    <path d="M318 180c35-22 77-26 120-10" fill="none" stroke="#a9e6ff" stroke-width="7" opacity=".7"/>
    <path d="M347 215 412 222 432 252 382 249 361 235z" fill="#14171d" stroke="#07080b" stroke-width="7"/>
    <path d="M413 222 440 226 435 253 431 252z" fill="#ffd800"/>
    <path d="M345 230 367 241 376 266" fill="none" stroke="#e5a500" stroke-width="6"/>
    <circle cx="382" cy="141" r="7" fill="#fff7bd" opacity=".8"/>
  </g>

  <!-- Brand motion accent; deliberately non-textual so the asset works across screens. -->
  <g fill="none" stroke="#ffd800" stroke-linecap="round">
    <path d="M118 121h83" stroke-width="6" opacity=".85"/>
    <path d="M137 141h63" stroke-width="4" opacity=".5"/>
    <path d="M523 116h80" stroke-width="6" opacity=".85"/>
    <path d="M523 136h58" stroke-width="4" opacity=".5"/>
  </g>
</svg>
